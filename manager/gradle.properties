android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
# paperSU: keep build scratch files off the C: drive. The project-level value wins
# over the same key in the Gradle user home, so it has to be set here.
# If you move the workspace, update this path (the directory must already exist).
org.gradle.jvmargs=-Xmx2048m -Djava.io.tmpdir=D:/Users/code/.papersu-work/tmp
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose

# ---- paperSU branding (paperSU is a rebrand built on SukiSU-Ultra, itself derived from KernelSU) ----
KSU_PACKAGE_NAME=top.becuy.eric.papersu
KSU_NAME=PaperSU
